name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: Python tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  web-build:
    name: Web UI build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

  frida-script-validation:
    name: Frida script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JS syntax
        run: |
          for f in frida_scripts/*.js; do
            echo "Checking $f ..."
            node --check "$f" 2>&1 || true
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build full agent and verify
        run: |
          python -c "
          from intruder.script_loader import build_agent, AVAILABLE_SCRIPTS
          agent = build_agent(sorted(AVAILABLE_SCRIPTS), debug=False)
          print(f'Agent built: {len(agent)} chars, scripts: {sorted(AVAILABLE_SCRIPTS)}')
          assert len(agent) > 1000, 'Agent too small'
          assert 'interceptSend' in agent
          assert 'interceptRecv' in agent
          assert 'attachToFunctionInLibraries' in agent
          print('All assertions passed')
          "
